server {
    listen 80;
    server_name pakapay.ng www.pakapay.ng _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;
    gzip_min_length 512;

    # --- Baseline security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Pages ---
    # Every internal link on the site is an absolute https://pakapay.ng/... URL,
    # so this only needs to resolve exact filenames — no rewriting required.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # --- Custom 404 ---
    # Serves your real 404.html with an actual HTTP 404 status, not a 200.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
